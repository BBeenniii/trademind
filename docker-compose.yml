services:
  postgres:
    image: postgres:16-alpine
    container_name: trademind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trademind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trademind}
      POSTGRES_DB: ${POSTGRES_DB:-trademind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trademind} -d ${POSTGRES_DB:-trademind}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: